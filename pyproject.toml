[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data3001-transport"
version = "0.2.0"
description = "Contract-bound historical GDP surface-transport research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4", "pandas==3.0.6", "pyarrow==26.0.0", "scipy==1.16.3",
  "zarr==2.18.7", "shapely==2.2.0", "pyproj==3.7.2", "pyshp==2.3.1",
  "duckdb==1.4.3", "requests==2.34.2", "torch==2.14.1", "matplotlib==3.10.8",
  "netCDF4==1.7.4", "h5py==3.16.0", "psutil==7.2.2", "xarray==2025.3.1",
  "s3fs==2026.9.0", "numcodecs==0.15.1", "pillow==12.3.0",
  "jupyterlab>=4,<5", "ipykernel==7.4.0", "nbformat>=5,<6", "nbclient>=0.10,<1",
  "python-docx>=1,<2", "lxml>=5", "markdown-it-py>=3", "mdit-py-plugins>=0.4",
  "latex2mathml>=3",
]

[project.optional-dependencies]
continuous = ["torch==2.14.1", "matplotlib"]
data-repair = ["netCDF4==1.7.4", "h5py==3.16.0"]

[tool.setuptools.packages.find]
where = ["code/shared/_compat"]
include = ["data3001*"]

[tool.setuptools.package-data]
"data3001.modelling" = ["assets/*.js", "assets/*.txt", "assets/*.json"]
"data3001.modelling.markov_models" = ["*.cpp"]
"data3001.modelling.continuous_models" = ["*.cpp"]
