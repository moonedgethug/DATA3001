[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data3001-transport"
version = "0.1.0"
description = "Contract-bound historical GDP surface-transport research"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "pandas", "pyarrow", "zarr<3", "shapely", "pyproj", "pyshp", "duckdb", "requests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["data3001*"]
